<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>TGH Live Viewer</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
           background: #111; color: #eee; }
    header { padding: 8px 14px; background: #1a1a1a; border-bottom: 1px solid #2a2a2a;
             display: flex; gap: 16px; align-items: center; font-size: 13px; }
    header label { display: flex; align-items: center; gap: 6px; }
    header input[type=range] { width: 220px; }
    #status { margin-left: auto; opacity: 0.7; font-variant-numeric: tabular-nums; }
    #wrap { display: flex; justify-content: center; padding: 16px; }
    #view { display: block; background: #000; border-radius: 6px;
            cursor: grab; touch-action: none; image-rendering: auto; }
    #view:active { cursor: grabbing; }
    .help { padding: 6px 14px; font-size: 11px; opacity: 0.5; }
    code { background: #222; padding: 1px 5px; border-radius: 3px; font-size: 11px; }
  </style>
</head>
<body>
  <header>
    <strong>TGH Live</strong>
    <label>server <input id="url" type="text" value="ws://localhost:8765" size="22" /></label>
    <label>time <input id="t" type="range" min="0" max="1" step="0.0033" value="0.5" />
           <span id="tval" style="display:inline-block;width:3em">0.50</span></label>
    <label>quality <select id="quality">
      <option value="640x480">640x480</option>
      <option value="800x600" selected>800x600</option>
      <option value="1024x768">1024x768</option>
      <option value="1280x720">1280x720</option>
    </select></label>
    <button id="play">▶ play time</button>
    <button id="reset">⟳ reset view</button>
    <span id="status">disconnected</span>
  </header>
  <div id="wrap"><canvas id="view" width="800" height="600"></canvas></div>
  <div class="help">
    Drag to orbit · scroll to zoom · shift+drag to pan · time slider scrubs frames ·
    requires <code>python tgh_serve.py</code> running on the same machine.
  </div>

<script>
//
// === Camera state (orbits a target point) ===
//
// World convention matches the EasyVolcap / Neural3DV / OpenCV setup: Y is
// "down" in world space (so world_up = -Y), camera looks along +Z.
//
// Initial pose targets the actual scene content (kitchen + chef).
// flame_salmon's cameras sit around (0.4, -1.2, -0.3) facing +Z; the kitchen
// itself is ~4-6 units forward of them. We start a touch behind camera 00,
// looking at that volume.
const state = {
  target: [0.5, -1.0, 4.5],   // approximate scene center for flame_salmon
  yaw: 0,                     // rotation about world Y axis (radians)
  pitch: 0,                   // rotation about camera-right axis
  dist: 5.0,                  // distance from target (camera ~5u behind it)
  fovDeg: 75,                 // vertical fov; dataset cameras are ~85deg
};

const canvas = document.getElementById('view');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const tSlider = document.getElementById('t');
const tVal = document.getElementById('tval');
const quality = document.getElementById('quality');
const playBtn = document.getElementById('play');
const urlEl = document.getElementById('url');

let ws = null;
let pending = false;     // true while waiting for a frame from the server
let needSend = false;    // true if state changed while pending
let lastSendT = 0;
let frames = 0;
let lastFpsT = performance.now();
let playing = false;

// Resolution dropdown
function applyQuality() {
  const [w, h] = quality.value.split('x').map(Number);
  canvas.width = w; canvas.height = h;
  request();
}
quality.addEventListener('change', applyQuality);

// Mouse / touch input
let dragging = false, panning = false, lastX = 0, lastY = 0;
canvas.addEventListener('mousedown', e => {
  dragging = true; panning = e.shiftKey;
  lastX = e.clientX; lastY = e.clientY;
});
window.addEventListener('mouseup', () => { dragging = false; });
window.addEventListener('mousemove', e => {
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  if (panning) {
    // pan target in camera frame
    const {right, up} = cameraAxes();
    const k = state.dist * 0.0015;
    state.target = vsub(state.target, vadd(vscale(right, dx * k), vscale(up, -dy * k)));
  } else {
    state.yaw -= dx * 0.005;
    state.pitch = clamp(state.pitch - dy * 0.005, -Math.PI/2 + 0.05, Math.PI/2 - 0.05);
  }
  request();
});
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  state.dist *= Math.exp(e.deltaY * 0.001);
  state.dist = clamp(state.dist, 0.5, 200);
  request();
}, {passive: false});

// Time slider
tSlider.addEventListener('input', () => {
  tVal.textContent = parseFloat(tSlider.value).toFixed(2);
  request();
});
playBtn.addEventListener('click', () => {
  playing = !playing;
  playBtn.textContent = playing ? '⏸ pause' : '▶ play time';
});
document.getElementById('reset').addEventListener('click', () => {
  state.target = [0.5, -1.0, 4.5];
  state.yaw = 0; state.pitch = 0; state.dist = 5.0; state.fovDeg = 75;
  request();
});
function tickTime() {
  if (playing) {
    let v = parseFloat(tSlider.value) + 0.0033;  // ~10s sequence at 30fps -> 1/300 per frame
    if (v >= 1) v = 0;
    tSlider.value = v;
    tVal.textContent = v.toFixed(2);
    request();
  }
  requestAnimationFrame(tickTime);
}
requestAnimationFrame(tickTime);

//
// === Camera math (world-to-camera, OpenCV) ===
//
function cameraAxes() {
  // forward = direction from camera to target (camera looks along +Z)
  const cy = Math.cos(state.yaw), sy = Math.sin(state.yaw);
  const cp = Math.cos(state.pitch), sp = Math.sin(state.pitch);
  // camera position offset from target (in world coords)
  const offset = [state.dist * sy * cp, -state.dist * sp, -state.dist * cy * cp];
  //                            ^                ^                ^
  //  yaw rotates around world Y; pitch tilts; world Y is down.
  const camPos = vadd(state.target, offset);
  const forward = vnormalize(vsub(state.target, camPos));   // world frame, camera Z+
  // world "up" is -Y (so world Y is down -> camera Y down = world Y)
  const worldDown = [0, 1, 0];
  let right = vnormalize(vcross(worldDown, forward));
  if (vlen(right) < 1e-6) right = [1, 0, 0];
  const down = vnormalize(vcross(forward, right));          // camera Y in world frame
  return {camPos, forward, right, up: vscale(down, -1)};
}

function getPose() {
  const {camPos, forward, right, up} = cameraAxes();
  const down = vscale(up, -1);
  // R (world-to-camera): rows are camera axes in world frame (right, down, forward).
  const R = [
    [right[0],   right[1],   right[2]],
    [down[0],    down[1],    down[2]],
    [forward[0], forward[1], forward[2]],
  ];
  // T (world-to-camera): -R @ camPos
  const T = [
    [-(R[0][0]*camPos[0] + R[0][1]*camPos[1] + R[0][2]*camPos[2])],
    [-(R[1][0]*camPos[0] + R[1][1]*camPos[1] + R[1][2]*camPos[2])],
    [-(R[2][0]*camPos[0] + R[2][1]*camPos[1] + R[2][2]*camPos[2])],
  ];
  const W = canvas.width, H = canvas.height;
  const f = (H / 2) / Math.tan((state.fovDeg * Math.PI / 180) / 2);
  const K = [[f, 0, W/2], [0, f, H/2], [0, 0, 1]];
  return {K, R, T, H, W, t: parseFloat(tSlider.value), n: 0.5, f: 200.0};
}

//
// === WebSocket ===
//
function connect() {
  const url = urlEl.value.trim();
  if (ws) { ws.close(); }
  statusEl.textContent = 'connecting…';
  ws = new WebSocket(url);
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => { statusEl.textContent = 'connected'; request(); };
  ws.onclose = () => { statusEl.textContent = 'disconnected'; };
  ws.onerror = () => { statusEl.textContent = 'error'; };
  ws.onmessage = ev => {
    const latency = performance.now() - lastSendT;
    if (typeof ev.data === 'string') {
      try { const m = JSON.parse(ev.data); if (m.error) statusEl.textContent = 'render error: ' + m.error; } catch {}
      pending = false; if (needSend) { needSend = false; request(); }
      return;
    }
    const blob = new Blob([ev.data], {type: 'image/jpeg'});
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => {
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      frames++;
      const now = performance.now();
      if (now - lastFpsT > 1000) {
        const fps = frames / ((now - lastFpsT) / 1000);
        statusEl.textContent = `${fps.toFixed(1)} fps · ${latency.toFixed(0)} ms`;
        frames = 0; lastFpsT = now;
      }
      pending = false;
      if (needSend) { needSend = false; request(); }
    };
    img.src = url;
  };
}
urlEl.addEventListener('change', connect);

function request() {
  if (!ws || ws.readyState !== 1) return;
  if (pending) { needSend = true; return; }
  pending = true;
  lastSendT = performance.now();
  ws.send(JSON.stringify(getPose()));
}

// Vector helpers
function vadd(a, b)   { return [a[0]+b[0], a[1]+b[1], a[2]+b[2]]; }
function vsub(a, b)   { return [a[0]-b[0], a[1]-b[1], a[2]-b[2]]; }
function vscale(a, k) { return [a[0]*k, a[1]*k, a[2]*k]; }
function vlen(a)      { return Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2]); }
function vnormalize(a){ const l = vlen(a) || 1; return [a[0]/l, a[1]/l, a[2]/l]; }
function vcross(a, b) { return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]]; }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

// boot
connect();
</script>
</body>
</html>
